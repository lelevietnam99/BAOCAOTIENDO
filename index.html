        let danhSachVoSinh = [];
        let indexDangXuLy = -1;

        async function taiDanhSach() {
            const clubName = document.getElementById("clubSelect").value;
            document.getElementById("loading").style.display = "block";
            
            try {
                const response = await fetch(`${API_URL}?sheet=${clubName}`);
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                } else {
                    danhSachVoSinh = data;
                    hienThiBang();
                }
            } catch (error) {
                alert("Lỗi kết nối mạng!");
            }
            document.getElementById("loading").style.display = "none";
        }

        // Hàm giúp rút gọn văn bản danh sách (bài thi)
        function rutGonText(text) {
            if (!text || text === "---" || text.trim() === "") return "<span style='color:#94a3b8;'><i>Chưa có</i></span>";
            let arr = text.split(",").map(s => s.trim()).filter(s => s);
            if (arr.length === 0) return "<span style='color:#94a3b8;'><i>Chưa có</i></span>";
            if (arr.length <= 2) return text;
            return `${arr[0]}, ${arr[1]} ... <span style="color:#3b82f6; font-size:12px; font-weight:800;">(+${arr.length - 2})</span>`;
        }

        function formatTyLe(tyLeGoc) {
            let tyLeStr = (tyLeGoc || "0").toString().trim();
            if (tyLeStr.includes("%")) return tyLeStr;
            let num = parseFloat(tyLeStr);
            if (!isNaN(num)) {
                if (num > 0 && num <= 1) return Math.round(num * 100) + "%";
                return Math.round(num) + "%";
            }
            return "0%";
        }

        function hienThiBang() {
            const tbody = document.getElementById("duLieuBang");
            tbody.innerHTML = "";
            
            danhSachVoSinh.forEach((vs, index) => {
                let tyLe = formatTyLe(vs["Tỷ lệ hoàn thành (%)"]);
                let mauSac = (tyLe === "0%") ? "dong-do" : "dong-xanh";

                let linkBai = vs["Link bài dự thi"] ? `<a href="${vs["Link bài dự thi"]}" target="_blank" class="action-link">Xem</a>` : "---";
                let linkProfile = vs["Link profile"] ? `<a href="${vs["Link profile"]}" target="_blank" class="action-link">Mở</a>` : "---";
                
                let daXong = vs["Những bài đã hoàn thành"] || "---";
                let chuaXong = vs["Những bài chưa hoàn thành"] || "---";
                let ghiChu = vs["Ghi chú"] || "---";

                // Bọc ghi chú vào thẻ div để giữ nguyên dấu xuống dòng
                let htmlGhiChu = ghiChu !== "---" 
                    ? `<div class="box-ghi-chu">${ghiChu}</div><div style="font-size:11px; color:#94a3b8; margin-top:4px;">✏️ Sửa</div>` 
                    : `<span style='color:#94a3b8;'><i>Trống</i></span> ✏️`;

                let tr = document.createElement("tr");
                tr.className = mauSac;
                
                tr.innerHTML = `
                    <td>${vs["STT"]}</td>
                    <td style="font-weight: 700; color: #0f172a;">${vs["Họ và tên"]}</td>
                    <td onclick="moBangChamDiem(${index})" class="clickable-cell" title="Nhấp để chấm điểm"><span class="badge-cap-dai">${vs["Cấp đai hiện tại"]} ✏️</span></td>
                    <td onclick="xemChiTiet(${index}, 'Đã hoàn thành')" class="clickable-cell" style="font-size:13px;" title="Nhấp xem chi tiết">${rutGonText(daXong)}</td>
                    <td onclick="xemChiTiet(${index}, 'Chưa hoàn thành')" class="clickable-cell" style="font-size:13px; color:#ef4444;" title="Nhấp xem chi tiết">${rutGonText(chuaXong)}</td>
                    <td style="text-align: center;"><span class="badge-ty-le">${tyLe}</span></td>
                    <td>${linkBai}</td>
                    <td>${linkProfile}</td>
                    <td onclick="suaGhiChu(${index})" class="clickable-cell" style="font-size:13px; vertical-align:top;" title="Nhấp xem/sửa ghi chú">${htmlGhiChu}</td>
                    <td style="font-size:13px; color:#64748b; font-weight:600;">${vs["Ngày cập nhật"] || "---"}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- CÁC HÀM MỞ POPUP ---

        function moBangChamDiem(index) {
            indexDangXuLy = index;
            const vs = danhSachVoSinh[index];
            const capDai = vs["Cấp đai hiện tại"];
            
            if (!CHUNG_TRINH_HOC[capDai]) {
                alert("Chưa có chương trình học cho: " + capDai);
                return;
            }

            document.getElementById("modalTitleChamDiem").innerHTML = `📋 Đánh giá: <span style="color:#3b82f6;">${vs["Họ và tên"]}</span>`;
            
            const listDiv = document.getElementById("modalCheckboxList");
            listDiv.innerHTML = "";
            const cacBaiDaTick = (vs["Những bài đã hoàn thành"] || "").split(", ");

            CHUNG_TRINH_HOC[capDai].forEach((bai, idx) => {
                const isChecked = cacBaiDaTick.includes(bai) ? "checked" : "";
                listDiv.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" id="chk_${idx}" value="${bai}" ${isChecked}>
                        ${bai}
                    </label>
                `;
            });
            document.getElementById("modalChamDiem").style.display = "flex";
        }

        function xemChiTiet(index, loai) {
            const vs = danhSachVoSinh[index];
            let duLieu = (loai === 'Đã hoàn thành') ? vs["Những bài đã hoàn thành"] : vs["Những bài chưa hoàn thành"];
            
            if (!duLieu || duLieu === "---") {
                alert("Chưa có dữ liệu để hiển thị!");
                return;
            }

            let arr = duLieu.split(",").map(s => s.trim()).filter(s => s);
            document.getElementById("modalTitleChiTiet").innerHTML = `🔍 Các bài <span style="color:${loai==='Đã hoàn thành'?'#10b981':'#ef4444'};">${loai}</span>`;
            
            const listChiTiet = document.getElementById("danhSachChiTiet");
            listChiTiet.innerHTML = "";
            arr.forEach(bai => {
                listChiTiet.innerHTML += `<li>${bai}</li>`;
            });
            
            document.getElementById("modalChiTiet").style.display = "flex";
        }

        function suaGhiChu(index) {
            indexDangXuLy = index;
            const vs = danhSachVoSinh[index];
            let ghiChuHienTai = vs["Ghi chú"] === "---" ? "" : vs["Ghi chú"];
            document.getElementById("txtGhiChu").value = ghiChuHienTai;
            document.getElementById("modalGhiChu").style.display = "flex";
        }

        function dongModal(idModal) {
            document.getElementById(idModal).style.display = "none";
        }

        // --- CÁC HÀM LƯU DỮ LIỆU LÊN MÂY ---

        async function luuGhiChu() {
            let btn = document.getElementById("btnSaveGhiChu");
            btn.innerText = "⏳ Đang lưu..."; btn.disabled = true;

            const vs = danhSachVoSinh[indexDangXuLy];
            const clubName = document.getElementById("clubSelect").value;
            const ghiChuMoi = document.getElementById("txtGhiChu").value.trim();

            const payload = {
                action: "ghiChu",
                sheet: clubName,
                rowIndex: vs.rowIndex,
                ghiChu: ghiChuMoi
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                vs["Ghi chú"] = ghiChuMoi || "---";
                hienThiBang();
                dongModal('modalGhiChu');
            } catch (error) { alert("Lỗi khi lưu Ghi Chú!"); }
            
            btn.innerText = "💾 Lưu Ghi Chú"; btn.disabled = false;
        }

        async function luuDanhGia() {
            let btn = document.getElementById("btnSaveChamDiem");
            btn.innerText = "⏳ Đang lưu..."; btn.disabled = true;
            
            const vs = danhSachVoSinh[indexDangXuLy];
            const clubName = document.getElementById("clubSelect").value;
            const capDai = vs["Cấp đai hiện tại"];
            const baiThiList = CHUNG_TRINH_HOC[capDai];
            
            let baiDaXong = []; let baiChuaXong = [];
            baiThiList.forEach((bai, idx) => {
                if (document.getElementById(`chk_${idx}`).checked) baiDaXong.push(bai);
                else baiChuaXong.push(bai);
            });

            const tyLe = Math.round((baiDaXong.length / baiThiList.length) * 100) + "%";
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} - ${now.getDate().toString().padStart(2, '0')}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()}`;

            const payload = {
                action: "chamDiem",
                sheet: clubName,
                rowIndex: vs.rowIndex,
                daXong: baiDaXong.join(", "),
                chuaXong: baiChuaXong.join(", "),
                tyLe: tyLe,
                ngayCapNhat: timeString
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                vs["Những bài đã hoàn thành"] = payload.daXong;
                vs["Những bài chưa hoàn thành"] = payload.chuaXong;
                vs["Tỷ lệ hoàn thành (%)"] = payload.tyLe;
                vs["Ngày cập nhật"] = payload.ngayCapNhat;
                
                hienThiBang();
                dongModal('modalChamDiem');
            } catch (error) { alert("Lỗi khi lưu dữ liệu!"); }
            
            btn.innerText = "💾 Lưu Kết Quả"; btn.disabled = false;
        }
    </script>
</body>
</html>
